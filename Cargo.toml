[package]
name = "moon"
version = "0.1.0"
edition = "2024"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "moon"
bench = false
test = false

[dependencies]
siderust = { version = "0.18.1", default-features = false }
libc = { version = "0.2", default-features = false }

[profile.dev]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
